name: Engine checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build
        working-directory: AvalonCore
        run: swift build
      - name: Test
        working-directory: AvalonCore
        run: swift test
      - name: Demo
        working-directory: AvalonCore
        run: swift run avalon-demo

  app:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build the iOS app (Xcode project)
        run: |
          xcodebuild -version
          xcodebuild -project AvalonApp/Avalon.xcodeproj -scheme Avalon \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -40
